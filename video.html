<!DOCTYPE html><html><head><title>Video | Bilal Kamran</title><link rel="stylesheet" href="style.css"></head><body><section><div class="video-viewer" id="viewer"><iframe id="player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div><div><button id="fullscreen">Fullscreen</button><a href="javascript:history.back()"><button>Back</button></a></div></section><script>const p=new URLSearchParams(location.search);const player=document.getElementById('player');player.src=p.get('url')||'';const viewer=document.getElementById('viewer');document.getElementById('fullscreen').onclick=()=>{if(player.requestFullscreen)player.requestFullscreen();else if(viewer.requestFullscreen)viewer.requestFullscreen();};</script></body></html>
