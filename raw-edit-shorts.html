<!DOCTYPE html>
<html>
<head>
  <title>Shorts | Bilal Kamran</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .video-background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: -1;
      background: #020617;
    }

    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.7);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="video-background-container">
    <div class="video-overlay"></div>
  </div>

  <section>
    <h2>Shorts</h2>
    <div class="cards video-cards vertical-cards">
      <!-- Old YouTube Short -->
      <a rel="noopener" target="_blank" class="card video-card" href="video.html?url=https://www.youtube.com/embed/eXN0BVGsdQE?autoplay=1 & playsinline=1">
        <img class="video-thumb" src="https://img.youtube.com/vi/eXN0BVGsdQE/maxresdefault.jpg" alt="Short preview" loading="lazy">
      </a>
      <!-- Old Drive Short 1 -->
      <a rel="noopener" target="_blank" class="card video-card" href="video.html?url=https://drive.google.com/file/d/1JHNLZoSjW-ONlv2ZrHPkGDvWHL2Y3a8j/preview">
        <img class="video-thumb" src="https://drive.google.com/thumbnail?id=1JHNLZoSjW-ONlv2ZrHPkGDvWHL2Y3a8j" alt="Short preview" loading="lazy">
      </a>
      <!-- Old Drive Short 2 -->
      <a rel="noopener" target="_blank" class="card video-card" href="video.html?url=https://drive.google.com/file/d/1uw62d3xf9te-LPLRb3ETVBI5gOoq_Jgv/preview">
        <img class="video-thumb" src="https://drive.google.com/thumbnail?id=1uw62d3xf9te-LPLRb3ETVBI5gOoq_Jgv" alt="Short preview" loading="lazy">
      </a>
      <!-- New Drive Video 1 -->
      <a rel="noopener" target="_blank" class="card video-card" href="video.html?url=https://drive.google.com/file/d/1ZsY4NkGy0onlCqBUi5gsLc-8DlJCEDpD/preview">
        <img class="video-thumb" src="https://drive.google.com/thumbnail?id=1ZsY4NkGy0onlCqBUi5gsLc-8DlJCEDpD" alt="Video 1 preview" loading="lazy">
      </a>
      <!-- New Drive Video 2 -->
      <a rel="noopener" target="_blank" class="card video-card" href="video.html?url=https://drive.google.com/file/d/19cB7ENPCvWixMKx5MNe32Z9G_wURTHzG/preview">
        <img class="video-thumb" src="https://drive.google.com/thumbnail?id=19cB7ENPCvWixMKx5MNe32Z9G_wURTHzG" alt="Video 2 preview" loading="lazy">
      </a>
      <!-- New Drive Video 3 -->
      <a rel="noopener" target="_blank" class="card video-card" href="video.html?url=https://drive.google.com/file/d/1HU1M5wm8VTYSvfz54XhRmQLeFC2I3naN/preview">
        <img class="video-thumb" src="https://lh3.googleusercontent.com/d/1HU1M5wm8VTYSvfz54XhRmQLeFC2I3naN=s400" alt="Video 3 preview" loading="lazy">
      </a>
    </div>
    <a href="index.html">
      <button>Back</button>
    </a>
  </section>

  <script src="background.js"></script>
</body>
</html>
